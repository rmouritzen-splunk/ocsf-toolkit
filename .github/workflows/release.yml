name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Moving major-version tags are intentional for maintained actions: this project prefers receiving compatible fixes
# automatically over commit-SHA pinning.
jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          # This is intentionally a simple typo guard, not full SemVer validation. Release tags are
          # maintainer-controlled, so duplicating the complete SemVer parser here would add complexity without
          # materially protecting this workflow. Keep scripts/latest-release-tag.sh's eligibility rule aligned.
          case "${GITHUB_REF_NAME}" in
            *+*)
              printf 'Release tags must not contain build metadata (+): %s\n' \
                "${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          case "${GITHUB_REF_NAME}" in
            v[0-9]*) ;;
            *)
              printf 'Release tag must begin with v followed by a digit: %s\n' \
                "${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Set up verification tools
        uses: ./.github/actions/setup-verification-tools

      - name: Build release artifacts
        run: make package VERSION="${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            --verify-tag
            --generate-notes
            --title "${GITHUB_REF_NAME}"
          )

          case "${GITHUB_REF_NAME}" in
            *-*) release_args+=(--prerelease) ;;
          esac

          gh release create "${GITHUB_REF_NAME}" "${release_args[@]}" dist/*
