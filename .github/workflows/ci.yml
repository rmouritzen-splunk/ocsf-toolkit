name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Moving major-version tags are intentional for maintained actions: this project prefers receiving compatible fixes
# automatically over commit-SHA pinning.
jobs:
  verify:
    name: Verify all target platforms with Go 1.27.0
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Set up verification tools
        uses: ./.github/actions/setup-verification-tools

      - name: Check, test, and build all target platforms
        run: make all

  minimum-go:
    name: Test with minimum Go 1.25.x
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Test with the selected Go 1.25 toolchain
        env:
          GOTOOLCHAIN: local
        run: go test ./...

  benchmarks:
    name: Compare benchmarks with latest release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository with release tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Compare with latest eligible release
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          scripts/benchmark-compare.sh --count 5 --time 250ms 2>&1 | tee build/benchmark-comparison.txt

      - name: Add benchmark comparison to job summary
        if: always()
        shell: bash
        run: |
          if [[ -s build/benchmark-comparison.txt ]]; then
            {
              echo '## Benchmark comparison'
              echo '```text'
              cat build/benchmark-comparison.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  native-tests:
    name: Native tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Run native tests
        run: |
          go test ./...
          go test -race ./...

      - name: Run native tests with JSON v2
        env:
          GOEXPERIMENT: jsonv2
        run: go test ./...
