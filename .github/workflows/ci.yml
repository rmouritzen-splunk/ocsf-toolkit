name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  verify:
    name: Verify all target platforms with Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.0"
          - "1.26.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: binary
          install-only: true

      - name: Show golangci-lint version
        run: golangci-lint version

      - name: Verify all target platforms
        run: make verify-all-platforms

  benchmarks:
    name: Compare benchmarks with latest release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository with release tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Compare with latest eligible release
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          make benchmark-compare 2>&1 | tee build/benchmark-comparison.txt

      - name: Add benchmark comparison to job summary
        if: always()
        shell: bash
        run: |
          if [[ -s build/benchmark-comparison.txt ]]; then
            {
              echo '## Benchmark comparison'
              echo '```text'
              cat build/benchmark-comparison.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  native-tests:
    name: Native tests on ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Run native tests
        run: go test ./...
